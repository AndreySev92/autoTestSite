plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Версии зависимостей
ext {
    junitVersion = '5.10.1'
    assertjVersion = '3.25.1'
    restAssuredVersion = '5.4.0'
    seleniumVersion = '4.17.0'
    webdriverManagerVersion = '5.6.3'
    mockitoVersion = '5.8.0'
    jacksonVersion = '2.16.0'
    allureVersion = '2.25.0'
}

dependencies {

    testImplementation 'io.rest-assured:json-schema-validator:5.3.0'

    // Lombok для тестов
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // JUnit 5 (основа)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'

    // AssertJ
    testImplementation 'org.assertj:assertj-core:3.25.1'

    // Selenium WebDriver
    implementation 'org.seleniumhq.selenium:selenium-java:4.15.0'

    // REST Assured (для API)
    implementation  'io.rest-assured:rest-assured:6.0.1'

    // Jackson для работы с JSON (нужен для REST Assured)
    implementation  'com.fasterxml.jackson.core:jackson-databind:2.15.3'

    // Selenium (для UI)
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.17.0'

    // WebDriverManager (автоматически скачивает драйверы)
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    implementation 'io.github.bonigarcia:webdrivermanager:5.8.0'

    // Lombok (чтобы не писать геттеры/сеттеры)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

test {
    useJUnitPlatform()
}

// Задача для запуска UI тестов
tasks.register('uiTest', Test) {
    useJUnitPlatform {
        includeTags 'ui'
    }
    description = 'Run UI tests only'
    group = 'verification'
}

// Задача для запуска API тестов
tasks.register('apiTest', Test) {
    useJUnitPlatform {
        includeTags 'api'
    }
    description = 'Run API tests only'
    group = 'verification'
}
